<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sovereign Wire">
<title>Sovereign Wire</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#101820;--mu:#5b6b7b;--ac:#1b4d8f;--ln:#d5dce3;--hi:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--sf:#16202a;--ink:#e6edf3;--mu:#8fa1b3;--ac:#6aa7ff;--ln:#243241;--hi:#f0a04b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141b;--sf:#16202a;--ink:#e6edf3;--mu:#8fa1b3;--ac:#6aa7ff;--ln:#243241;--hi:#f0a04b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;margin:0;line-height:1.2}
h1{font-size:28px}h2{font-size:30px}h3{font-size:19px;font-weight:600}
.sub{color:var(--mu);font-size:14px;margin:4px 0 20px}
.note{background:var(--sf);border-left:3px solid var(--hi);padding:10px 12px;font-size:14px;margin:0 0 16px}
a{color:var(--ac)}
.row{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none}
.row:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hi{color:var(--hi);font-size:14px;font-weight:600;white-space:nowrap}
.row p{margin:8px 0 0;color:var(--mu);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.chips button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
article{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);margin-bottom:8px}
.pips{display:inline-flex;gap:3px}.pips i{width:7px;height:7px;border-radius:50%;background:var(--ln)}.pips i.on{background:var(--hi)}.tag{border:1px solid var(--ac);color:var(--ac);border-radius:4px;padding:0 6px;font-size:12px}
article ul{margin:10px 0;padding-left:20px}article li{margin:4px 0}
.why{border-left:3px solid var(--ac);padding:2px 0 2px 10px;margin:10px 0;font-size:15px}
.src{font-size:13px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 14px}
.back{display:inline-block;margin-bottom:14px;font-size:15px}
@media(prefers-reduced-motion:no-preference){.chips{scroll-behavior:smooth}}
</style></head><body><main id="app"></main>
<script>
const C=[["argentina","Argentina"],["venezuela","Venezuela"],["dominican-republic","Dominican Republic"]];
const SAMPLE={updated:null,countries:{
argentina:[{t:"Sample: Treasury widens peso debt auction",o:"Muestra: el Tesoro amplía la licitación",u:"",s:"Sample source",h:2,k:"official",sc:5,tp:"Debt management",b:["Placeholder summary line one.","Placeholder summary line two."],w:"Placeholder: explains why this would matter for the country’s bonds."},{t:"Sample: Central bank holds policy rate",o:"Muestra: el BCRA mantiene la tasa",u:"",s:"Sample source",h:9,k:"x",sc:3,tp:"Monetary",b:["Placeholder summary line."],w:"Placeholder rationale."}],
venezuela:[{t:"Sample: Government comments on debt talks",o:"Muestra: el gobierno comenta las negociaciones",u:"",s:"Sample source",h:4,sc:4,tp:"Political",b:["Placeholder summary line."],w:"Placeholder rationale."}],
"dominican-republic":[{t:"Sample: Finance ministry outlines 2027 budget",o:"Muestra: Hacienda presenta el presupuesto",u:"",s:"Sample source",h:6,sc:4,tp:"Fiscal",b:["Placeholder summary line."],w:"Placeholder rationale."}]}};
let D=SAMPLE,live=false,T="All";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=a=>a.d?(Date.now()-new Date(a.d))/6e4:a.h*60;
const ago=a=>{const m=Math.max(1,Math.round(mins(a)));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const list=k=>(D.countries[k]||[]).slice().sort((a,b)=>b.sc-a.sc||mins(a)-mins(b));
const pips=n=>'<span class="pips" role="img" aria-label="Relevance '+n+' of 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+"</span>";
function home(){return'<h1>Sovereign Wire</h1><p class="sub">'+(live&&D.updated?"Updated "+ago({d:D.updated}):"Local news, translated and ranked for bond risk")+"</p>"+C.map(([k,n])=>{const L=list(k),h=L.filter(a=>a.sc>=4).length;return'<a class="row" href="#'+k+'"><div class="top"><h3>'+n+'</h3><span class="hi">'+(h?h+" high impact":L.length+" stories")+"</span></div><p>"+esc(L[0]?L[0].t:"No stories yet")+"</p></a>"}).join("")}
function country(c){const L=list(c[0]),tp=["All","Official","X posts",...new Set(L.map(a=>a.tp))],V=L.filter(a=>T==="All"||(T==="Official"?a.k==="official":T==="X posts"?a.k==="x":a.tp===T));
return'<a class="back" href="#">Home</a><h2>'+c[1]+'</h2><p class="sub">'+L.length+" stories ranked by relevance to bond pricing</p><div class=\"chips\">"+tp.map(t=>'<button aria-pressed="'+(t===T)+'" data-t="'+esc(t)+'">'+esc(t)+"</button>").join("")+"</div>"+(V.map(a=>'<article><div class="meta">'+pips(a.sc)+"<span>"+esc(a.tp)+"</span>"+(a.k==="official"?'<span class="tag">Official</span>':a.k==="x"?'<span class="tag">X post</span>':"")+"</div><h3>"+esc(a.t)+"</h3><ul>"+(a.b||[]).map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul><div class="why">'+esc(a.w)+'</div><div class="src"><span>'+esc(a.s)+"</span><span>"+ago(a)+"</span>"+(/^https?:/.test(a.u)?'<a href="'+esc(a.u)+'" target="_blank" rel="noopener">Original: '+esc(a.o)+"</a>":"")+"</div></article>").join("")||"<p>No stories in this topic.</p>")}
function render(keep){const k=location.hash.slice(1),c=C.find(x=>x[0]===k);$("app").innerHTML=(live?"":'<p class="note">Showing sample data, not real news. Run collector.py and host feed.json next to this page to see live stories.</p>')+(c?country(c):home());if(!keep)scrollTo(0,0)}
$("app").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(b){T=b.dataset.t;render(true)}});
addEventListener("hashchange",()=>{T="All";render()});
(async()=>{try{const r=await fetch("feed.json",{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();live=true}catch(e){D=SAMPLE}render()})();
</script></body></html>
